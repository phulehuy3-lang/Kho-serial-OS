name: PRG-02 WIF Credential Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-wif-acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - id: auth
        name: Authenticate through PRG-02 WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.PRG02_WIF_PROVIDER }}
          service_account: ${{ secrets.PRG02_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: ">= 363.0.0"

      - name: Assert authentication path only
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_SERVICE_ACCOUNT: ${{ secrets.PRG02_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"

          actual="$(gcloud auth list \
            --filter=status:ACTIVE \
            --format='value(account)')"

          test -n "$actual"
          test "$actual" = "$EXPECTED_SERVICE_ACCOUNT"

          echo "OIDC_TOKEN_ISSUANCE=PASS"
          echo "STS_WIF_EXCHANGE=PASS"
          echo "SERVICE_ACCOUNT_IMPERSONATION=PASS"
          echo "SHORT_LIVED_ACCESS_TOKEN=PASS"
          echo "PRINCIPAL_MATCH=PASS"
          echo "RESOURCE_READ_EXECUTED=false"
          echo "RESOURCE_WRITE_EXECUTED=false"
