name: PRG-02 WIF Credential Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-wif-acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - id: auth
        name: Authenticate through PRG-02 WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.PRG02_WIF_PROVIDER }}
          service_account: ${{ secrets.PRG02_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only
          create_credentials_file: false
          export_environment_variables: false

      - name: Assert sanitized authentication path only
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_SERVICE_ACCOUNT: ${{ secrets.PRG02_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$ACCESS_TOKEN"
          test -n "$EXPECTED_SERVICE_ACCOUNT"

          echo "OIDC_TOKEN_ISSUANCE=PASS"
          echo "STS_WIF_EXCHANGE=PASS"
          echo "SERVICE_ACCOUNT_IMPERSONATION=PASS"
          echo "SHORT_LIVED_ACCESS_TOKEN=PASS"
          echo "EXPECTED_PRINCIPAL_SECRET_PRESENT=PASS"
          echo "PROJECT_LOCATOR_EXPORTED=false"
          echo "TARGET_RESOURCE_READ_EXECUTED=false"
          echo "RESOURCE_WRITE_EXECUTED=false"
