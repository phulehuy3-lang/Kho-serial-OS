name: PRG-03 Effective Drive Permission Proof

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  effective-drive-permission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - id: auth
        name: Authenticate through PRG-02 WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ secrets.PRG02_WIF_PROVIDER }}
          service_account: ${{ secrets.PRG02_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/drive.metadata.readonly
          create_credentials_file: false
          export_environment_variables: false

      - name: Prove exact Drive metadata permission only
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          TARGET_FILE_ID: ${{ secrets.PRG03_TARGET_FILE_ID }}
        run: |
          set -euo pipefail

          test -n "$ACCESS_TOKEN"
          test -n "$TARGET_FILE_ID"

          http_code="$(
            curl --silent --show-error               --output /tmp/prg03-drive-response.json               --write-out '%{http_code}'               --header "Authorization: Bearer $ACCESS_TOKEN"               "https://www.googleapis.com/drive/v3/files/${TARGET_FILE_ID}?fields=kind&supportsAllDrives=true"
          )"

          test "$http_code" = "200"
          python - <<'PY'
          import json
          with open("/tmp/prg03-drive-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert data == {"kind": "drive#file"}, "Unexpected Drive metadata response shape"
          PY

          rm -f /tmp/prg03-drive-response.json

          echo "OIDC_TOKEN_ISSUANCE=PASS"
          echo "STS_WIF_EXCHANGE=PASS"
          echo "SERVICE_ACCOUNT_IMPERSONATION=PASS"
          echo "SHORT_LIVED_ACCESS_TOKEN=PASS"
          echo "DRIVE_METADATA_GET=PASS"
          echo "DRIVE_EFFECTIVE_PERMISSION=PASS"
          echo "TARGET_LOCATOR_EXPORTED=false"
          echo "WORKSHEET_PAYLOAD_READ=false"
          echo "RESOURCE_WRITE_EXECUTED=false"
