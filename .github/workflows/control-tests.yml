name: Kho Serial OS Control Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          check-latest: false

      - name: Enforce public repository boundary
        run: python scripts/check_repo_boundary.py .

      - name: Enforce warehouse serial sole-mission scope
        run: python scripts/check_warehouse_serial_scope_v1.py .

      - name: Enforce introduced Git history boundary
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python scripts/check_git_history_boundary.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
            python scripts/check_git_history_boundary.py "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Enforce static capability gate
        run: python scripts/check_static_quality.py .

      - name: Run deterministic unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
