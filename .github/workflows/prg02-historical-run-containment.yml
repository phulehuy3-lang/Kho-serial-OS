name: PRG-02 Historical Run Containment

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prg02-historical-run-containment.yml"

permissions:
  actions: write
  contents: read

jobs:
  contain-historical-run:
    if: github.repository_id == '1383239508' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Delete exact historical workflow run and verify containment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runId = 37105787660;
            const { owner, repo } = context.repo;

            try {
              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: runId,
              });
              core.info("HISTORICAL_RUN_DELETE_REQUEST=PASS");
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info("HISTORICAL_RUN_ALREADY_ABSENT=true");
            }

            try {
              await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: runId,
              });
              core.setFailed("Historical workflow run remains accessible after delete.");
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info("HISTORICAL_RUN_GET_404=PASS");
              core.info("HISTORICAL_RUN_CONTAINMENT=PASS");
            }
